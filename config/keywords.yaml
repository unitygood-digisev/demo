# 追蹤名單與關鍵字（系統 7）
# 由使用者提供。目前為空範本。
#
# 填寫說明：每個詞一段，欄位如下
#   詞:      要追蹤的詞，例如公司名稱、法規名稱
#   類別:    客戶／同業／主管機關／法規與準則／議題
#   權重:    1–5，越重要越高
#   同義詞:  其他寫法，例如英文名、簡稱（可以留空）
#   單獨不算: true 時，這一組只在同時命中其他關鍵字時才算（可省略）
#
# 詞的寫法（用全形符號）：「A＋B」＝兩個都要出現；「A／B」＝任一個即可。半形 + 當一般文字。
# 檔案最上層可寫：
#   不能單獨算的詞: [ESG, 永續]   ← 這些詞要同時命中其他關鍵字才算
#   輸出等級: 內部一般            ← 命中詞含客戶名稱時，產出要標的等級（預設公開）
#
# 範例（請刪掉開頭的 # 後改成真實資料）：
# keywords:
#   - 詞: 範例關鍵字
#     類別: 議題
#     權重: 3
#     同義詞: [Example Keyword]

keywords: []
