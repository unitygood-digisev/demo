# 追蹤名單與關鍵字（系統 7）
# 由使用者提供：副執行長 2026-10-15 的回覆（問題清單第 6 題）。
# 這是「雲端版」：已拿掉客戶名稱與人名（2026-10-15 使用者決定），可以提交、可以給雲端排程用。
# 完整版（含客戶與人名）只放公司電腦的 config/keywords.local.yaml；有完整版時系統優先用它。
# 重要程度寫範圍時取較高值、同業依同業表逐項設定、主管機關一組單獨不算、ESG／永續／淨零不能單獨算：2026-10-19 副執行長已確認。
#
# 填寫說明：每個詞一段，欄位如下
#   詞:      要追蹤的詞，例如公司名稱、法規名稱
#   類別:    客戶／同業／主管機關／法規與準則／議題
#   權重:    1–5，越重要越高
#   同義詞:  其他寫法，例如英文名、簡稱（可以留空）
#   單獨不算: true 時，這一組只在同時命中其他關鍵字時才算（可省略）
#
# 詞的寫法（用全形符號）：「A＋B」＝兩個都要出現；「A／B」＝任一個即可。半形 + 當一般文字。
# 檔案最上層可寫：
#   不能單獨算的詞: [ESG, 永續]   ← 這些詞要同時命中其他關鍵字才算
#   輸出等級: 內部一般            ← 命中詞含客戶名稱時，產出要標的等級（預設公開）
#
# 範例（請刪掉開頭的 # 後改成真實資料）：
# keywords:
#   - 詞: 範例關鍵字
#     類別: 議題
#     權重: 3
#     同義詞: [Example Keyword]

不能單獨算的詞: [ESG, 永續, 淨零]

