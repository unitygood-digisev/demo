# 會議紀錄 → 看板補齊建議（階段 2b）的規則
# 會議紀錄放在 data/raw/meetings/，檔名要有 8 碼日期，例如「業務會議紀錄_20260907.txt」。
# 這個檔只放通用規則，不放客戶名稱或人名（會提交到程式倉庫）。

folder: meetings            # data/raw/ 底下的資料夾
file_glob: "*.txt"          # 第一版只讀 UTF-8 文字檔

# 案名對應表：紀錄裡的簡稱 → 看板上的案名。含客戶名稱，只放本機，不提交。
# 格式見 config/meeting_aliases.example.yaml
aliases_file: config/meeting_aliases.yaml

# 標題含這些字的段落整段不讀（財務、人事、行政）。下一個標題沒有這些字時恢復讀取。
skip_section_words: [財務, 營運管理, 營收, 業績, 人事, 人資, 人力, 招募, 行政, 員工旅遊,
  辦公室, 勞資, 提醒, 風險控管, 內部活動, 尾牙, 服裝, 休假, 教育訓練與同仁, 同仁培訓]

# 一行裡（不論名稱或內容）有這些字，整行不讀；另外寫有「數字＋萬」金額的行也不讀。
# 這一行若提到看板上的案子，會列在「待人工確認」，請人看原文。
skip_line_words: [會議日期, 營收, 業績, 達成率, 發票, 收款, 請款, 尾款, 帳款, 缺口, 現金流,
  定存, 存款, 薪資, 預算, 經費, 報價, 金額, 萬元, 分潤, 毛利, 補助款, 付款, 代墊,
  人力, 人事, 招募, 面試, 實習生, 霸凌, 勞資, 內部活動, 尾牙, 員工旅遊, 辦公室, 服裝, 休假,
  未來發展]

# 比對案名時，拆開看板案名後，這些常見字詞不能單獨拿來比對（太籠統，會對錯案）
generic_words: [假資料, 醫院, 專班, 專案, 報告書, 工作坊, 系統開發, 結案, 核銷, 整體, 標案, 課程,
  活動, 論壇, 合作, 媒體合作, 提案, 明年度業務, 第二次, 內部工作坊, 大型活動, 遊程,
  表單, 交流會, 標章, 公開班, 第四期, 廠商, 驗收, 系統, SROI, ISO, 20121, 45003,
  B 型企業, 加速器, 三場工作坊, 桃園, 台南, 台中]

# 紀錄中代表階段的字眼（只輸出字眼本身，不輸出原文）
# 「完成」「結案」單獨出現常是「預計 9 月完成」，太容易誤判，所以不列
stage_words: [已結案, 正式結案, 完成結案, 延後, 延到, 順延, 暫緩, 暫不, 卡關, 待簽約]
# 其中代表「已經結束」的字眼：看板還沒結案時，列在「與看板不一致」
done_words: [已結案, 正式結案, 完成結案]
