# 永續情資日報｜品牌行銷部版 的關鍵字（2026-10-20 建立）
# 由使用者提供：品牌行銷部同仁 2026-10-19 填寫的關鍵字表單（Word 檔，不提交）。逐字照表單轉成本檔格式，未增刪詞。
# 這是「雲端版」：不含客戶名稱與人名，可以提交、可以給雲端排程用。
# 表單第 35 列「現有與目標客戶」的客戶名稱尚待填寫；填好後請放本機的 keywords_brand_marketing.local.yaml（不提交），系統會優先用它。
#
# 轉檔時的處理（請品牌行銷部確認）：
#   1. 表單寫「以上皆搭配『＋永續』」「後四者皆搭配『＋生物多樣性』」的，已逐一展開成「詞＋永續」「詞＋生物多樣性」。
#   2. 表單的「排除詞」系統還不支援，先寫在每組上方的註解裡保留，暫時不會生效。
#   3. 每組第一個詞當「詞」，其餘當「同義詞」；權重照表單的重要程度。
#   4. 類別只能用系統允許的值：同業動態→同業、自辦活動→自家品牌、揭露準則→法規與準則、主管機關→政策、標案→政府採購，其餘→議題。
#
# 詞的寫法（全形符號）：「A＋B」＝兩個都要出現；「A／B」＝任一個即可。格式說明見 keywords.yaml。

不能單獨算的詞: [ESG, 永續, 淨零]
輸出等級: 內部一般

