# 系統 1 項目進度看板：讀取公司現有看板的設定
# 看板的分頁名稱、欄名改了，只要改這個檔，不用改程式。

# 要讀的分頁與輸入檔
sheet: 項目看板
input_glob: 項目進度看板*.xlsx   # data/raw/ 下符合的檔案中，取檔名排序最後一個
# 標題列上一定有的欄名（標題列上方的說明文字會自動跳過）
header_anchor: 客戶／案子

# 看板欄名 → 系統欄位
columns:
  客戶／案子: 案子
  類別: 類別
  階段: 階段
  負責人: 負責人
  近期下一步: 下一步
  下一個日期: 下一個日期

# 資料等級：這兩欄含客戶未公開資訊，系統不讀入、不輸出（輸出維持「內部一般」）
excluded_columns: [卡點／風險, 備註]

# 階段（與看板的下拉選單一致）
stages: [規劃中, 洽談中, 進行中, 卡關, 結案中, 已完成, 暫緩]
done_stages: [已完成]            # P01／P02 不計
blocked_stages: [卡關]           # P03
active_stages: [進行中, 結案中, 卡關]   # 應有下一步日期、計入負責人案數、檢查長期沒變化（待主管確認）

# 負責人欄裡不是人名的寫法，不計入負責人案數
non_person_owners: [行政, 全體專案人員]

# 看板標題列上方的說明文字中，若有 YYYY/M/D 日期，視為看板資料日期
board_date_pattern: '(\d{4})[/-](\d{1,2})[/-](\d{1,2})'
