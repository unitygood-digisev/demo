# 外部情報來源清單（系統 7）
# 由使用者提供。程式不會自己新增來源。
# 2026-10-15：使用者同意先放勾選表（docs/intel_sources_candidates.md）第一節的 9 個官方 RSS，
# 副執行長勾選後再增減。每個網址都在 2026-10-15 實際讀取過，robots.txt 允許、不需登入。
#
# 填寫說明：每個來源一段，欄位如下
#   id:      英文代號，不可重複，例如 moenv_news
#   名稱:    來源名稱，例如 環境部新聞稿
#   類型:    rss 或 html（html 只在網站允許時才抓）
#   網址:    完整網址
#   語言:    zh-TW 或 en
#   分類:    法規與準則／同業動態／客戶動態／其他
#
# 範例（請刪掉開頭的 # 後改成真實資料）：
# sources:
#   - id: example_rss
#     名稱: 範例來源
#     類型: rss
#     網址: https://example.com/feed.xml
#     語言: zh-TW
#     分類: 法規與準則

