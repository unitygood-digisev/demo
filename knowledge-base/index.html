<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; form-action 'none'">
<title>公司知識庫</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>公司知識庫</h1>
    <p class="sub">公司資料與知識條目。內部敏感與客戶機密只存摘要與「請洽內部」的索引。資料只存在這台電腦的瀏覽器，不連任何外部服務。</p>
  </div>
  <div class="actions">
    <button class="btn" id="btnNewFact">新增公司資料</button>
    <button class="btn" id="btnNewEntry">新增知識條目</button>
  </div>
</header>

<main>
  <section id="empty" class="empty" hidden>
    <h2>知識庫還是空的</h2>
    <p>先新增一筆公司資料（服務項目、部門、流程…）或一筆知識條目（SOP、案例、提案範本…）。</p>
    <button class="btn" id="btnFirst">新增第一筆</button>
  </section>

  <div class="split" id="split">
    <section class="panel">
      <input type="search" class="searchbar" id="search" placeholder="搜尋名稱、摘要、全文、標籤、內容…" aria-label="搜尋">
      <div class="chips" id="kindChips"></div>
      <div class="chips" id="subChips"></div>
      <ul class="items" id="items"></ul>
    </section>
    <section class="panel col-right" id="detail">
      <p class="muted">從左邊選一筆，查看詳情。</p>
    </section>
  </div>
</main>

<dialog id="editDialog">
  <form class="dialog-body" id="editForm">
    <h2 id="editTitle"></h2>
    <p class="notice" id="sensitiveNotice" hidden></p>
    <div id="editFields"></div>
    <div class="dialog-actions">
      <button type="button" class="btn secondary" id="editCancel">取消</button>
      <button type="submit" class="btn" id="editSave">儲存</button>
    </div>
  </form>
</dialog>

<script src="kb.js"></script>
<script src="app.js"></script>
</body>
</html>
