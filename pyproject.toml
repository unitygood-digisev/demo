[project]
name = "unity-mgmt-suite"
version = "0.1.0"
description = "優樂地管理層系統（執行長與主管用）"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas",
  "openpyxl",
  "pydantic>=2",
  "PyYAML",
  "requests",
  "feedparser",
  "python-docx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
