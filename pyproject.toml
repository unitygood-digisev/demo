[project]
name = "sourcedraft"
version = "2.0.0"
description = "溯稿 SourceDraft：永續報告書初稿產線（ESG Draft Skill v2）"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8"]

[project.scripts]
sourcedraft = "sourcedraft.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sourcedraft"]

[tool.setuptools.package-data]
sourcedraft = ["prompts/*.md"]
